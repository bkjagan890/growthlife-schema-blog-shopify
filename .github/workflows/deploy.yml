name: Deploy to Shopify

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Logic tests
        run: node test/pure.test.mjs

      - name: GraphQL document tests
        run: node test/gql.test.mjs

      - name: Theme block tests
        run: node test/theme.test.mjs

      - name: Build
        run: npx shopify app build

      - name: Deploy
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: npx shopify app deploy --allow-updates --source-control-url "$COMMIT_URL"
